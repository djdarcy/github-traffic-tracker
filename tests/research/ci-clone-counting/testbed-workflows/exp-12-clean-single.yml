name: "Exp 12: Clean Single Checkout"
# Day 12 — Clean replication of Exp 02/10 (Pages disabled).
# Exp-10 was contaminated by Pages build clones (+1/day).
# Pages is now disabled — this is the clean control run.
# Hypothesis: +1 clone, +1 unique (matching exp-02)
on: workflow_dispatch

jobs:
  single:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        run: |
          echo "=== Experiment 12: Clean Single Checkout ==="
          echo "Clean replication of Exp 02 (Pages disabled)."
          echo "Checkout version: actions/checkout@v4"
          echo "Runner: $(uname -a)"
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Git remote:"
          git remote get-url origin | sed 's/x-access-token:[^@]*/x-access-token:REDACTED/'
