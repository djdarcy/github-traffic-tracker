name: "Exp 13: Clean Matrix 3x3"
# Day 13 — Clean replication of Exp 05/11 (Pages disabled).
# Exp-11 was contaminated by Pages build clones (+1/day).
# Pages is now disabled — this is the clean control run.
# Hypothesis: +9 clones, +1 unique (matching exp-05)
on: workflow_dispatch

jobs:
  matrix-job:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dim1: [a, b, c]
        dim2: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Report
        run: |
          echo "=== Experiment 13: Clean Matrix 3x3 ==="
          echo "Clean replication of Exp 05 (Pages disabled)."
          echo "Matrix cell: dim1=${{ matrix.dim1 }}, dim2=${{ matrix.dim2 }}"
          echo "Checkout version: actions/checkout@v4"
          echo "Runner: $(uname -a)"
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
